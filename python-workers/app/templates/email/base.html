<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CampusFlow{% endblock %}</title>
  <style>
    body { margin:0; padding:0; background:#f5f5f8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .wrapper { max-width:600px; margin:32px auto; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); }
    .header  { background:#4f46e5; padding:28px 32px; }
    .header h1 { margin:0; color:#ffffff; font-size:20px; font-weight:700; letter-spacing:-.3px; }
    .header p  { margin:4px 0 0; color:rgba(255,255,255,.75); font-size:13px; }
    .body    { padding:32px; color:#1e1e2e; font-size:15px; line-height:1.6; }
    .body h2 { margin:0 0 16px; font-size:18px; color:#1e1e2e; }
    .meta    { background:#f5f5f8; border-radius:8px; padding:16px 20px; margin:20px 0; font-size:13px; color:#555; }
    .meta strong { color:#1e1e2e; }
    .btn     { display:inline-block; margin-top:24px; padding:12px 24px; background:#4f46e5; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; }
    .footer  { padding:20px 32px; background:#f5f5f8; text-align:center; font-size:12px; color:#999; border-top:1px solid #ebebef; }
    .footer a { color:#4f46e5; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>CampusFlow</h1>
      <p>Smart Campus Operations Platform</p>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      &copy; {{ year }} CampusFlow &nbsp;|&nbsp;
      <a href="mailto:info@campusflow.com.tr">info@campusflow.com.tr</a>
    </div>
  </div>
</body>
</html>
