# Prod override — domain bazlı ayarlar
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
services:
  backend:
    environment:
      NODE_ENV: production
      FRONTEND_URL: https://campusflow.com.tr
      PUBLIC_API_URL: https://api.campusflow.com.tr
      RABBITMQ_MGMT_PUBLIC: https://mq.campusflow.com.tr

  frontend:
    build:
      context: ./1frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://api.campusflow.com.tr
        NEXT_PUBLIC_APP_URL: https://campusflow.com.tr
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://api.campusflow.com.tr
      NEXT_PUBLIC_APP_URL: https://campusflow.com.tr
