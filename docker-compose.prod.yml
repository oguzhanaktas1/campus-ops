    environment:
      NODE_ENV: production
      FRONTEND_URL: https://campusflow.com.tr,https://www.campusflow.com.tr
      PUBLIC_API_URL: https://api.campusflow.com.tr
      RABBITMQ_MGMT_PUBLIC: https://mq.campusflow.com.tr

  ai-service:
    environment:
      OLLAMA_BASE_URL: http://188.132.177.60:11434
      AI_DEFAULT_MODEL: gemma4:e2b
      AI_FALLBACK_MODEL: llama3.2:1b

  frontend:
    build:
      context: ./1frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://api.campusflow.com.tr
        NEXT_PUBLIC_APP_URL: https://campusflow.com.tr
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://api.campusflow.com.tr
      NEXT_PUBLIC_APP_URL: https://campusflow.com.tr
