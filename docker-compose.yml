services:
  postgres:
    image: postgres:16-alpine
    container_name: campusops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campusops_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusops"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campusops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: campusops-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: campusops
      RABBITMQ_DEFAULT_PASS: campusops_mq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./2backend
      dockerfile: Dockerfile
    container_name: campusops-backend
    restart: unless-stopped
    env_file:
      - ./2backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      # Docker-specific overrides — service hostnames replace localhost
      NODE_ENV: production
      RUN_MIGRATIONS: "false"
      REDIS_HOST: redis
      REDIS_URL: ""
      RABBITMQ_URL: amqp://campusops:campusops_mq@rabbitmq:5672
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      WORKERS_INTERNAL_URL: http://python-workers:8001
      METRICS_INTERNAL_URL: http://python-workers:8000
      PROMETHEUS_URL: http://python-workers:8000
      AI_SERVICE_BASE_URL: http://ai-service:8010
    ports:
      - "5000:5000"

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: campusops-ai-service
    restart: unless-stopped
    env_file:
      - ./services/ai-service/.env
    environment:
      # Docker-specific overrides
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      ENABLE_DOCS: "false"
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/live')"]
      interval: 30s
      timeout: 5s
      retries: 3

  python-workers:
    build:
      context: ./python-workers
      dockerfile: Dockerfile
    container_name: campusops-workers
    restart: unless-stopped
    env_file:
      - ./python-workers/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Docker-specific overrides — service hostnames replace localhost
      RABBITMQ_URL: amqp://campusops:campusops_mq@rabbitmq:5672
      REDIS_URL: redis://redis:6379/0
      ENV: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./1frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: campusops-frontend
    restart: unless-stopped
    env_file:
      - ./1frontend/.env
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
